# Publishes the built app to GitHub Pages so it can be opened on a real iPad.
#
# This is a test link, not the deployment Part 3 of the brief asks for: it exists so the touch and
# stylus work can be tried on the device it was written for, which no emulator proves. Part 3 stays
# out of scope.
#
# Lint and the unit tests gate the build, so a link that is live is a link that at least compiles
# and passes what runs without a browser. The Playwright suite is not run here — it needs browser
# downloads and is run locally before a commit.
name: Pages

on:
  push:
    branches: [main]
  # Lets the site be republished without a code change.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a newer push wins over one still building.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - run: npm run build
        env:
          # Must match the repository name: Pages serves the site under /<repo>/.
          BASE_PATH: /anesthesia-record/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
